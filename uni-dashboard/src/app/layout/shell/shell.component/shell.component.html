<mat-toolbar>
  <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon" (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>UniDashboard</span>
  <span class="example-spacer"></span>
<button matIconButton  matBadge="3" matBadgeColor="warn">
  <mat-icon>notifications</mat-icon>
</button>

<button matIconButton>
  <mat-icon>account_circle</mat-icon>
</button>
</mat-toolbar>

<mat-sidenav-container class="example-container">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list>
      <mat-list-item>
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
        <a routerLink="" routerLinkActive="active">Login</a>
      </mat-list-item>
      <mat-list-item>
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
        <a routerLink="dashboard" routerLinkActive="active">dashboard</a>
      </mat-list-item>
      <mat-list-item>
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
        <a routerLink="students" routerLinkActive="active">students</a>
      </mat-list-item>
      <mat-list-item>
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon>
        <a routerLink="courses" routerLinkActive="active">courses</a>
      </mat-list-item>
    </mat-nav-list> 
  </mat-sidenav>
  <mat-sidenav-container><router-outlet></router-outlet></mat-sidenav-container>
</mat-sidenav-container>
