<section>
    @if (post) {
    <h1>Post details</h1>
    <mat-list role="list">
        <mat-list-item role="listitem"><strong>Id:</strong> {{ post.id }}</mat-list-item>
        <mat-divider></mat-divider>

        <mat-list-item role="listitem"><strong>Author:</strong> {{ post.author }}</mat-list-item>
        <mat-divider></mat-divider>

        <mat-list-item role="listitem"><strong>Title:</strong> {{post.title}}</mat-list-item>
        <mat-divider></mat-divider>

    </mat-list>

    <a routerLink="/postList" matButton="outlined">Back to Posts</a>
    } @else {
    <p>Post not found.</p>
    }
</section>
