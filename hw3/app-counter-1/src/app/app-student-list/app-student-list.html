<h1>Exercise 3 — Student List with Filtering</h1>

<table mat-table [dataSource]="students" class="mat-elevation-z8">

    <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let student">
            {{ student.name }}
        </td>
    </ng-container>

    <ng-container matColumnDef="major">
        <th mat-header-cell *matHeaderCellDef>Major</th>
        <td mat-cell *matCellDef="let student">
            {{ student.major }}
        </td>
    </ng-container>

    <ng-container matColumnDef="grade">
        <th mat-header-cell *matHeaderCellDef>Grade</th>
        <td mat-cell *matCellDef="let student" [ngClass]="{'honor': student.grade === Grades.A}">
            {{ student.grade }}
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>

<p class="text">Count: <strong>{{ students.length }}</strong></p>
