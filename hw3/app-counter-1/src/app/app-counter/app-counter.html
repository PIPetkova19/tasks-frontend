<section>

    <h1>Exercise 1 — Counter Component</h1>
    <p class="text">{{counter()}}</p>

    @if(counter()>=10){
    <p class="text">Maximum reached</p>
    }

    <div class="example-button-row">
        <button (click)="increase()" matButton="elevated">+</button>
        <button (click)="decrease()" matButton="elevated">-</button>
        <button (click)="reset()" matButton="elevated">Reset</button>
    </div>

    <p class="text">Status: <strong>{{ status() }}</strong></p>

</section>
