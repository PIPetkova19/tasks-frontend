<section>
  <h1>Exercise 11 — Lifecycle Hooks Sequence</h1>
  <button (click)="show.set(!show())" matButton="elevated">
    {{ show() ? 'Destroy Timer' : 'Create Timer' }}
  </button>

  <div>
    <mat-form-field appearance="outline">
      <mat-label>Interval (ms):</mat-label>
      <input matInput type="number" id="intervalMs" [(ngModel)]="intervalMs" min="100" step="100">
    </mat-form-field>
  </div>

  @if (show()) {
  <app-timer [interval]="intervalMs"></app-timer>
  }
</section>
