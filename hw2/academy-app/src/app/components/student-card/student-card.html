<ul>
    <li>Name: {{name}}</li>
    <li>Role: {{role}}</li>
    <li>Skills:</li>
    <ul>
        @for(skill of skills; track skill){
        <li>{{skill}}</li>
        }
    </ul>
</ul>

<button (click)="toggleButton()">{{showDesc ? 'Hide Details' : 'Show Details'}}</button>

<p *ngIf="showDesc">Description: {{description}}</p>

<button (click)="removeStudent()">Remove</button>
